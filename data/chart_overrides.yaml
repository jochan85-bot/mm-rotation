# 종목 페이지 가격 차트 — 표시 보정 목록(시세 오류 봉).
# 차트 데이터(docs/data/charts/<티커>.json)와 점수 데이터는 고치지 않는다. 이 목록은 종목 페이지가 차트를 그리기 직전에만 적용된다.
# 보정 방식(mode):
#   clip(기본) — 지정한 필드(low/high)가 그 봉의 시가·종가 범위 밖이면 범위 끝으로 자른다(low → min(시가, 종가), high → max(시가, 종가)). 시가·종가 불변.
#   set        — 지정한 필드(open/high/low/close)를 corrected 값으로 바꾼다. 야후가 아닌 두 번째 시세 소스로 정상값을 확인한 봉에만 쓴다(source 에 출처).
#   한 봉에 둘 다 있으면 set 을 먼저, clip 을 나중에 적용한다. 주봉은 보정된 일봉으로 묶는다.
# original 이 현재 차트 데이터 값과 다르면(원천이 바뀐 경우) 그 항목은 적용하지 않는다.
# clip 의 corrected 는 규칙으로 계산한 기록용 값이다(시험에서 규칙 결과와 같은지 확인).

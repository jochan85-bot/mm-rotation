meta:
  block: MM-PROXY-FIX-20261014
  prepared: '2026-10-09'
  principle: 1x = 발행사가 공시한 공식 지수 하나. 다른 지수·유사 ETF 대용 금지. 1x ETF 는 그 문서에 동일 지수 명시 시에만 채택.
  sources: spec/threex_etf.yaml(Direxion 497K 2026-02-27 · ProShares 497K 2026-09-28), spec/onex_etf.yaml(1x ETF 발행사 문서), spec/microsectors.yaml(BMO 가격보충서·microsectors.com)
  validation_criteria: 3x 일간수익률 ~ 1x 일간수익률, 최근 252일 β 2.7~3.3 ∧ R²≥0.95 (n≥60)
  caveats:
  - Direxion·ProShares 497K 는 PR/TR 을 명시하지 않음 → return_type [부재]
  - S&P/Dow Jones/ICE 지수 제공사 페이지는 curl 403 → 지수 이력 URL [확인실패]
  - Direxion/ProShares 구성종목은 497K 에 미기재 → 1x ETF 상위 보유(yfinance funds_data)로 대체, 지수 구성과 동일 가정 [미검증]

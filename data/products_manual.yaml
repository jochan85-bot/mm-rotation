# 수작업 보강값 — scripts/mm_products_gen.py 가 products.yaml 생성 시 이 파일의 값으로 덮어쓴다(우선).
# 형식: 종목 티커 → {필드: 값}. 중첩 dict 는 재귀 병합, 리스트·문자열은 통째 교체.
# sector_theme 는 공식 지수명(index_specs.yaml official_name)을 한국어로 옮긴 표기이며 평가·전망 표현을 쓰지 않는다.
# 출처 표기: 각 항목에 사유를 주석으로 남긴다.
# ETN fee.summary 는 PS 본문 인용·BMO FWP 보도자료 기준 수작업 정리 — 숫자는 생성기가 fee.items[].quote·events 와 대조 검증한다.

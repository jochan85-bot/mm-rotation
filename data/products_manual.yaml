HIBL:
  sector_theme: 미국 대형주 중 고베타 100종 (S&P 500 High Beta)
  # 가중방식 보강 2026-10-09 (§6-A): Direxion 497K 가중방식 미명시 → S&P DJI 방법론(라이브 URL 403 → Wayback 보존본) + SPHB 투자설명서로 확인
  construction:
    weighting: 베타 비례 가중 (종목 i 의 비중 = Beta_i ÷ 구성종목 Beta 합; 시가총액 가중 아님)
    weighting_source:
      url: https://web.archive.org/web/20230701160959/https://spglobal.com/spdji/en/documents/methodologies/methodology-sp-high-beta-indices.pdf
      form: 'S&P Dow Jones Indices, S&P High Beta Indices Methodology (January 2023판) "Constituent Weightings": "the weight, w_i, for each index constituent i is set proportional to its beta" — S&P 500 High Beta Index N = 100 (p.6)'
      doc_date: '2023-01'
      note: 출처 — S&P DJI 방법론 원문의 Wayback 보존본(제공사 라이브 URL https://www.spglobal.com/spdji/en/documents/methodologies/methodology-sp-high-beta-indices.pdf 는 403 으로 대체). 보존본은 2023-01판이라 현행 일치 여부를 현행 문서로 교차확인 — Invesco S&P 500 High Beta ETF(SPHB, Invesco Exchange-Traded Fund Trust II) 485BPOS 2025-12-18 "The Underlying Index weights each constituent security in proportion to its beta, with the highest beta securities receiving the greatest weights" (https://www.sec.gov/Archives/edgar/data/1378872/000110465925122454/tm2532525d1_485bpos.htm)
    weighting_note: 'Direxion 497K 는 가중방식을 적지 않음(선정 규칙만 서술). 베타 비례 가중이 맞음을 방법론·SPHB 투자설명서 두 문서로 확인'
SOXL:

WEBL:
  sector_theme: 인터넷 (Dow Jones Internet Composite)
  # 가중방식 보강 2026-10-09 (§6-A): Direxion 497K 가중방식 미명시. S&P DJI 방법론 URL 403(spglobal.com 전 경로 403, 추정 파일명의 Wayback 조회는 404) → 동일 지수 1x 추종 상품 투자설명서로 대체
  construction:
    weighting: 유동주식 조정 시가총액 가중 (float-adjusted market-cap weighted) · 단일 종목 상한 10% · 비중 4.5% 초과 종목들의 누적 비중 상한 45%
    weighting_source:
      url: https://www.sec.gov/Archives/edgar/data/1329377/000144554626003279/etf1_fdn497k.htm
      form: 'First Trust Dow Jones Internet Index Fund(FDN, First Trust Exchange-Traded Fund) 497K 2026-05-01 Principal Investment Strategies: "Securities selected for inclusion in the Index are then weighted by float-adjusted market capitalization, subject to a single security weight cap of 10%. The cumulative weight of all companies within the Index with a weight greater than 4.5% cannot exceed 45% of the Index."'
      doc_date: '2026-05-01'
      note: 출처 — EDGAR 497K (제공사 방법론 403 으로 대체). FDN 은 Dow Jones Internet Composite Index 를 1x 로 추종하는 펀드이며 지수 구성 서술은 해당 문서의 것이다
    weighting_note: 'Direxion 497K 는 가중방식을 적지 않음(40종목 float-adjusted 시총 순위 선정까지만 서술). 가중 규칙은 FDN 497K 서술로 확인했고 제공사 방법론 원문으로는 확인하지 못함'

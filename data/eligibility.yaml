# 적격 규칙 — 운영값(백테스트 근거 아님, 오너 변경 가능). 값 변경은 이 파일만 수정한다.
# 기록: MM-PAGE-V2-20261014 §1. E1~E5 전부 충족 → 적격 순위표. E1~E4 미달 → "대기" 표. E5 해당 → "제외" 표.
version: 1
E1:
  name: 상장 거래일 수
  threshold: 252
  rule: 3배 상품 자체 일봉(확정 봉) 수 >= threshold
  reason: 상장 1년 미만 상품은 연간 사이클(변동성·낙폭·200일선)을 한 번도 거치지 않음 (운영값)
E2:
  name: 20일 평균 거래대금(USD, 백만)
  threshold: 1.0
  rule: 최근 20봉 평균(종가*거래량) >= threshold
  reason: 최소한의 체결 가능성 (운영값)
E3:
  name: 무거래 봉 한도
  threshold: 1
  rule: 최근 20봉 중 거래량 0 인 봉 수 <= threshold
  reason: 뭉치 등재 게이트의 무거래 가드와 같은 방식 (운영값)
E4:
  name: 1x 대리 품질
  beta_min: 2.7
  beta_max: 3.3
  r2_min: 0.85
  window: 최근 365 달력일 일간수익률 회귀(3배 on 1x), 표본 60개 미만이면 미달
  remeasure: 연 1회(측정일 365일 경과) + 표본 부족이던 종목은 E1~E3 충족 시 즉시 재측정
  reason: MM-P0B proxy_quality 정의 (베타 2.7~3.3, R2 0.85 이상)
E5:
  name: 문제 공지
  rule: data/status.json 의 excluded 항목이 있으면 제외 표 (조기상환·가속상환·상장폐지·청산, 배수 변경·지수 변경은 재확인 전까지)
  reason: 주 1회 공시 점검(mm_weekly_scan) 자동 기록
freshness:
  unconfirmed_bar: 최신 행 Close NaN 또는 거래량 < 직전 20봉 거래량 중앙값의 50% -> 미확정 봉(제외하고 직전 확정일로 산출, 상단 '잠정')
  stale: 종목별 최신 확정 봉(3배·1x)이 기준일과 다르면 ⚠ 순위 제외(fail-closed)
approx_badge: BULZ MNGU FNGU BNKU NRGU AIQU FLYU (1x ETF 가 지수와 다른 근사 대리 — 점수는 산출, 비고에 대리 티커)

# 표시·운영 규칙 — 운영값(백테스트 근거 아님, 오너 변경 가능). 값 변경은 이 파일만 수정한다.
# 기록: MM-PAGE-V2.3-20261015 §1·§2 (V2 의 대기 표 폐지 — 이전 값은 git 이력).
# 모집단(점수·순위 대상) = 유니버스 전체 중 E5 미해당 ∧ ⚠(최신 봉 불일치·이상 봉·피처 불가) 없는 종목. 백테스트 모집단과 동일.
# E1~E4 는 '표시 전용'(거래 가능성 열 배지) — 제외 조건이 아니며 점수 보정도 없다.
version: 3
E1:
  name: 상장 거래일 수 (표시 전용 — 배지 '신규')
  threshold: 252
  rule: 3배 상품 자체 일봉(확정 봉) 수 < threshold 이면 배지 '신규'
  reason: 상장 1년 미만 상품은 연간 사이클(변동성·낙폭·200일선)을 한 번도 거치지 않음 (운영값)
E2:
  name: 20일 평균 거래대금(USD, 백만) (표시 전용 — 배지 '저유동')
  threshold: 1.0
  rule: 최근 20봉 평균(종가*거래량) < threshold 이면 배지 '저유동'
  reason: 최소한의 체결 가능성 (운영값)
E3:
  name: 무거래 봉 (표시 전용 — 배지 '무거래N')
  threshold: 1
  rule: 최근 20봉 중 거래량 0 인 봉이 N(≥1)봉이면 배지 '무거래N' (V2.2 까지의 '≤1봉 허용' 문턱은 폐지, 1봉부터 표시)
  reason: 뭉치 등재 게이트의 무거래 가드와 같은 방식 (운영값)
E4:
  name: 1x 대리 품질 (표시 전용 — 배지 '근사' / '표본부족')
  beta_min: 2.7
  beta_max: 3.3
  r2_min: 0.85
  window: 최근 365 달력일 일간수익률 회귀(3배 on 1x)
  rule: 표본 n<60 이면 '표본부족'(경로는 공식 지수이나 검증 미완). n≥60 이고 β 가 [2.7,3.3] 밖이거나 R²<0.85 이면 '근사'
  remeasure: 연 1회(측정일 365일 경과) + 표본 부족이던 종목은 3배 일봉 60봉 이상 쌓이면 즉시 재측정
  reason: MM-P0B proxy_quality 정의 (베타 2.7~3.3, R2 0.85 이상) — 근사 배지 판정은 V2.3 부터 같은 기준
E5:
  name: 문제 공지 (유일한 제외 조건)
  rule: data/status.json 의 excluded 항목이 있으면 제외 표 (조기상환·가속상환·상장폐지·청산, 배수 변경·지수 변경은 재확인 전까지)
  reason: 주 1회 공시 점검(mm_weekly_scan) 자동 기록
freshness:
  unconfirmed_bar: 최신 행 Close NaN 또는 거래량 < 직전 20봉 거래량 중앙값의 50% -> 미확정 봉(제외하고 직전 확정일로 산출, 상단 '잠정')
  stale: 종목별 최신 확정 봉(3배·1x)이 기준일과 다르면 ⚠ 순위 제외(fail-closed)
anomaly:
  one_x: 0.25
  three_x: 0.75
  window: 60
  rule: 1x(지수 레벨) 일간수익률 |r|>one_x 인 봉이 기준일 이전 window 봉 안에 있으면 ⚠·순위 제외·σ60 보류(사유 '1x 이상 봉 YYYY-MM-DD'). 3배 봉은 |r|>three_x 이고 기준일 봉일 때 ⚠. 전 구간 목록은 data/anomalies.csv (운영값)

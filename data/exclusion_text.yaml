# 제외 목록 문구표 — 상태 파일(data/status.json)의 제외 사유 코드를 사람이 읽는 문장으로 바꾼다. 페이지에는 이 문장만 나가고 코드(E5 등)는 나가지 않는다.
# 렌더러(scripts/mm_site.py)가 읽는다. 파일이 없거나 항목이 빠지면 렌더러의 내장 기본 문장을 쓴다. MM-PAGE-V3-DESIGN-20261010 §5.
# {date} = 공지 날짜(YYYY-MM-DD).
excluded:
  조기상환·가속상환: "발행사 조기상환 공지, {date}"
  상장폐지·청산: "상장폐지·청산 공지, {date}"
  배수 변경: "배수 변경 공지, {date} — 3배 상품인지 재확인할 때까지 제외"
  지수 변경: "추종 지수 변경 공지, {date} — 지수 재확인할 때까지 제외"
default_excluded: "발행사 공지로 제외, {date}"
# 순위 계산에서 일시 제외된 종목(데이터 확인 중) — 상태 파일의 reason 문자열이 match 로 시작하면 text 를 쓴다.
held:
  - match: "최신 확정 봉이 기준일"
    text: "최신 가격이 아직 확인되지 않아 순위에서 일시 제외"
  - match: "1x 이상 봉"
    text: "기초 지수 가격에 이상 값이 있어 확인하는 동안 일시 제외"
  - match: "3배 이상 봉"
    text: "상품 가격에 이상 값이 있어 확인하는 동안 일시 제외"
  - match: "피처 산출 불가"
    text: "지수 가격 기록이 짧아 점수를 계산할 수 없어 일시 제외"
  - match: "데이터 없음"
    text: "가격 데이터를 받지 못해 일시 제외"
default_held: "데이터 확인 중이라 순위에서 일시 제외"
